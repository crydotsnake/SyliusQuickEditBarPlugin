imports:
    - { resource: "@SKrullSyliusQuickEditBarPlugin/config/config.yaml" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\SKrull\SyliusQuickEditBarPlugin

# Generate code with `vendor/bin/console make:*` into the plugin instead of the test application
when@dev:
    maker:
        root_namespace: 'SKrull\SyliusQuickEditBarPlugin'

# CI builds the test application without assets, the shop pages of the functional tests render without them
when@test:
    webpack_encore:
        strict_mode: false
